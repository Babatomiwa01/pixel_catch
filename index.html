
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Catch!</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100f2e;color:#fff;font-family:monospace;text-align:center;padding:20px}
h1{color:#43fdea;text-shadow:3px 3px #f72585;font-size:clamp(25px,6vw,40px)}
#hud{display:flex;justify-content:space-around;max-width:480px;margin:15px auto;color:#ffe66d;font-size:16px}
canvas{display:block;width:100%;max-width:480px;margin:auto;border:4px solid #43fdea;background:#171638;image-rendering:pixelated}
button{background:#f72585;color:white;border:0;padding:13px 18px;margin:8px 4px;font:bold 15px monospace;cursor:pointer;touch-action:manipulation}
button:hover{background:#b5179e}p{color:#c9c7ff}
</style>
</head>
<body>
<h1>★ PIXEL CATCH ★</h1>
<div id="hud"><span>⭐ <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span></div>
<canvas id="game" width="480" height="500"></canvas>
<div>
<button id="start">START GAME</button>
<button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button>
</div>
<p>Catch stars ⭐ · Dodge bombs 💣</p>
<p>Move with ← → or A / D</p>
<script>
const c=document.querySelector("#game"),ctx=c.getContext("2d");
const scoreEl=document.querySelector("#score"),livesEl=document.querySelector("#lives");
let player={x:210,y:450,w:60,h:20},items=[],score=0,lives=3,playing=false,keys={},last=0,spawn=0;
const startBtn=document.querySelector("#start");
function start(){score=0;lives=3;items=[];player.x=210;spawn=0;last=0;playing=true;startBtn.textContent="RESTART";scoreEl.textContent=0;livesEl.textContent=3;requestAnimationFrame(loop)}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function draw(){
rect(0,0,480,500,"#171638");
for(let i=0;i<45;i++){let x=(i*97)%480,y=(i*61)%500;rect(x,y,3,3,"#55527e")}
ctx.fillStyle="#ffe66d";ctx.font="20px monospace";ctx.fillText("★",15,30);
rect(player.x,player.y,player.w,player.h,"#43fdea");
rect(player.x+8,player.y-8,player.w-16,8,"#43fdea");
rect(player.x+15,player.y+5,8,5,"#171638");rect(player.x+38,player.y+5,8,5,"#171638");
for(const o of items){ctx.font="25px monospace";ctx.fillText(o.bomb?"💣":"⭐",o.x,o.y)}
if(!playing){rect(35,185,410,100,"#100f2e");ctx.textAlign="center";ctx.fillStyle="#ffe66d";ctx.font="bold 25px monospace";ctx.fillText(lives===0?"GAME OVER!":"READY PLAYER ONE?",240,225);ctx.fillStyle="white";ctx.font="16px monospace";ctx.fillText(lives===0?"Score: "+score:"Press START to play",240,255);ctx.textAlign="left"}
}
function loop(t){
if(!playing){draw();return}
let dt=Math.min((t-last)/16||1,2);last=t;
if(keys.ArrowLeft||keys.a||keys.A)player.x-=6*dt;
if(keys.ArrowRight||keys.d||keys.D)player.x+=6*dt;
player.x=Math.max(0,Math.min(480-player.w,player.x));
spawn+=dt;
if(spawn>Math.max(14,38-score/5)){items.push({x:Math.random()*450,y:-25,bomb:Math.random()<.25,speed:2+Math.random()*2+score/100});spawn=0}
for(let i=items.length-1;i>=0;i--){
let o=items[i];o.y+=o.speed*dt;
if(o.y+20>player.y&&o.y<player.y+player.h&&o.x+20>player.x&&o.x<player.x+player.w){
if(o.bomb)lives--;else score+=10;
items.splice(i,1);scoreEl.textContent=score;livesEl.textContent=lives;
if(lives<=0){playing=false;draw();return}
}else if(o.y>520)items.splice(i,1);
}
draw();requestAnimationFrame(loop)
}
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[e.key]=true});
document.addEventListener("keyup",e=>keys[e.key]=false);
function hold(id,key){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[key]=true};for(let ev of ["pointerup","pointerleave","pointercancel"])b.addEventListener(ev,()=>keys[key]=false)}
hold("left","ArrowLeft");hold("right","ArrowRight");
startBtn.onclick=start;draw();
</script>
</body>
</html>
